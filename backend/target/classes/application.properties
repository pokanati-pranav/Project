
# Application
spring.application.name=greenpulse-api

# Server
server.port=8081
server.address=0.0.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/greenpulse?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=revanth@1810
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# GreenPulse Configuration
greenpulse.jwt-secret=GreenPulse_Local_Dev_2026_Strong_Secret_32Bytesgreenpulse.jwt-expiration-ms=3600000
greenpulse.cors-origin=http://localhost:5173
greenpulse.ml-url=http://localhost:8001
greenpulse.allow-registration=false
greenpulse.jwt-expiration-ms=3600000

# Swagger
springdoc.swagger-ui.path=/swagger-ui
